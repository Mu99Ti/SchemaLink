<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Deep Canvas Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="50%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <!-- Problem Glow (Red / Warning) -->
    <radialGradient id="redGlow" cx="22%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Solution Glow (Cyan / Electric Blue) -->
    <radialGradient id="cyanGlow" cx="78%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="badCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181014" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0D080A" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="goodCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081826" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#040C14" stop-opacity="0.95" />
    </linearGradient>

    <!-- Borders -->
    <linearGradient id="badBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="goodBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.25" />
    </pattern>

    <!-- Top Bevel -->
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#64748B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#redGlow)" />
  <rect width="1280" height="640" fill="url(#cyanGlow)" />
  <rect width="1280" height="640" fill="url(#dotGrid)" />

  <!-- Top Razor Line -->
  <line x1="0" y1="0" x2="1280" y2="0" stroke="url(#topLine)" stroke-width="2.5" />

  <!-- ==================== HEADER BRANDING ==================== -->
  <g transform="translate(80, 50)">
    <!-- Badge -->
    <rect width="320" height="26" rx="4" fill="#0B132B" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="14" cy="13" r="3.5" fill="#00F0FF" />
    <text x="26" y="17" fill="#00F0FF" font-size="11" font-weight="700" class="mono" letter-spacing="1">SCHEMA RAG &amp; JOIN GRAPH ENGINE</text>

    <!-- Title -->
    <text x="0" y="70" fill="url(#brandGrad)" font-size="46" font-weight="800" class="sans" letter-spacing="-1.5">
      Schema<tspan fill="#00F0FF">Link</tspan>
    </text>
    <text x="310" y="68" fill="#64748B" font-size="15" class="mono">// STOP DUMPING 1,000 TABLES TO LLMs</text>

    <!-- Subtitle -->
    <text x="0" y="100" fill="#94A3B8" font-size="16" class="sans">
      Deterministic Schema Retrieval &amp; Multi-Hop Join Resolution for Enterprise Text-to-SQL
    </text>
  </g>

  <!-- ==================== BEFORE / AFTER DUAL BENTO ==================== -->

  <!-- LEFT CARD: THE BROKEN WAY (WITHOUT SCHEMALINK) -->
  <g transform="translate(80, 180)">
    <rect width="520" height="370" rx="12" fill="url(#badCardBg)" stroke="url(#badBorder)" stroke-width="1.2" />

    <!-- Card Header -->
    <rect width="520" height="42" rx="12" fill="#1C0F13" fill-opacity="0.9" />
    <path d="M 0 42 L 520 42" stroke="#7F1D1D" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="22" cy="21" r="5" fill="#EF4444" />
    <text x="38" y="25" fill="#FCA5A5" font-size="12" font-weight="700" class="mono">WITHOUT SCHEMALINK: NAIVE TEXT-TO-SQL</text>

    <!-- Symptom 1: Full DDL Dump -->
    <g transform="translate(24, 60)">
      <rect width="472" height="68" rx="6" fill="#0A0507" stroke="#450A0A" stroke-width="1" />
      <text x="16" y="24" fill="#EF4444" font-size="11" font-weight="700" class="mono">[!] CONTEXT SATURATION (120,000+ TOKENS)</text>
      <text x="16" y="44" fill="#94A3B8" font-size="12" class="mono">Prompt: Dump 400 tables DDL -> Context overflow</text>
      <text x="16" y="58" fill="#64748B" font-size="11" class="mono">Result: Hallucinates random columns from other tables</text>
    </g>

    <!-- Symptom 2: Disconnected Tables / Broken Join -->
    <g transform="translate(24, 140)">
      <rect width="472" height="68" rx="6" fill="#0A0507" stroke="#450A0A" stroke-width="1" />
      <text x="16" y="24" fill="#EF4444" font-size="11" font-weight="700" class="mono">[!] BROKEN JOIN PATHS (NO BRIDGE DISCOVERY)</text>
      <text x="16" y="44" fill="#94A3B8" font-size="12" class="mono">Query: "Customers who bought Laptops"</text>
      <text x="16" y="58" fill="#F87171" font-size="11" class="mono">Error: Joins Customers -> Products directly (FAIL: 0 rows)</text>
    </g>

    <!-- Symptom 3: Privacy & Security Risk -->
    <g transform="translate(24, 220)">
      <rect width="472" height="68" rx="6" fill="#0A0507" stroke="#450A0A" stroke-width="1" />
      <text x="16" y="24" fill="#EF4444" font-size="11" font-weight="700" class="mono">[!] RAW DATA VECTORIZATION HAZARD</text>
      <text x="16" y="44" fill="#94A3B8" font-size="12" class="mono">Embedding 5M operational rows into vector DB</text>
      <text x="16" y="58" fill="#F87171" font-size="11" class="mono">Result: PII leakage + cannot calculate exact SUM/AVG</text>
    </g>

    <!-- Bad Summary Badge -->
    <g transform="translate(24, 305)">
      <rect width="472" height="42" rx="6" fill="#2E0A0F" stroke="#7F1D1D" stroke-width="1" />
      <text x="16" y="26" fill="#FCA5A5" font-size="12" font-weight="600" class="mono">ACCURACY: 42% · LATENCY: 4.8s · TOKENS: 125,000</text>
    </g>
  </g>

  <!-- VS DIVIDER BADGE -->
  <g transform="translate(620, 345)">
    <circle cx="20" cy="20" r="18" fill="#0B132B" stroke="#334155" stroke-width="1.5" />
    <text x="13" y="25" fill="#94A3B8" font-size="11" font-weight="800" class="mono">VS</text>
  </g>

  <!-- RIGHT CARD: THE SCHEMALINK WAY -->
  <g transform="translate(680, 180)">
    <rect width="520" height="370" rx="12" fill="url(#goodCardBg)" stroke="url(#goodBorder)" stroke-width="1.5" />

    <!-- Card Header -->
    <rect width="520" height="42" rx="12" fill="#071927" fill-opacity="0.9" />
    <path d="M 0 42 L 520 42" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="22" cy="21" r="5" fill="#00F0FF" />
    <text x="38" y="25" fill="#38BDF8" font-size="12" font-weight="700" class="mono">WITH SCHEMALINK: HIGH-PRECISION SCHEMA RAG</text>

    <!-- Feature 1: Zero Row Vectorization -->
    <g transform="translate(24, 60)">
      <rect width="472" height="68" rx="6" fill="#030A12" stroke="#082F49" stroke-width="1" />
      <text x="16" y="24" fill="#00F0FF" font-size="11" font-weight="700" class="mono">[OK] ZERO ROW VECTORIZATION (SAFE &amp; LEAN)</text>
      <text x="16" y="44" fill="#F1F5F9" font-size="12" class="mono">Indexes DDL, metadata, business terms &amp; enums only</text>
      <text x="16" y="58" fill="#38BDF8" font-size="11" class="mono">Database remains single source of truth for records</text>
    </g>

    <!-- Feature 2: NetworkX Steiner Bridge Discovery -->
    <g transform="translate(24, 140)">
      <rect width="472" height="68" rx="6" fill="#030A12" stroke="#082F49" stroke-width="1" />
      <text x="16" y="24" fill="#00F0FF" font-size="11" font-weight="700" class="mono">[OK] DETERMINISTIC MULTI-HOP JOIN RESOLUTION</text>
      <text x="16" y="44" fill="#F1F5F9" font-size="12" class="mono">Auto-injects Orders &amp; Order_Items bridge tables</text>
      <text x="16" y="58" fill="#34D399" font-size="11" class="mono">Guaranteed valid join path: Cust -> Orders -> Items -> Prod</text>
    </g>

    <!-- Feature 3: Token Compactor & Compact DDL -->
    <g transform="translate(24, 220)">
      <rect width="472" height="68" rx="6" fill="#030A12" stroke="#082F49" stroke-width="1" />
      <text x="16" y="24" fill="#00F0FF" font-size="11" font-weight="700" class="mono">[OK] -84% TOKEN COMPACTION &amp; HITL SUPERVISION</text>
      <text x="16" y="44" fill="#F1F5F9" font-size="12" class="mono">Prunes irrelevant columns -> sends only 32 lines DDL</text>
      <text x="16" y="58" fill="#38BDF8" font-size="11" class="mono">Exemplar Memory Store learns from approved feedback</text>
    </g>

    <!-- Good Summary Badge -->
    <g transform="translate(24, 305)">
      <rect width="472" height="42" rx="6" fill="#062235" stroke="#00F0FF" stroke-width="1" />
      <text x="16" y="26" fill="#38BDF8" font-size="12" font-weight="700" class="mono">ACCURACY: 96% · LATENCY: 42ms · TOKENS: 320</text>
    </g>
  </g>

  <!-- ==================== FOOTER SPEC BAR ==================== -->
  <g transform="translate(80, 580)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="22" fill="#475569" font-size="11" class="mono">COMPATIBLE ENGINES: POSTGRESQL · MYSQL · SQLITE · MSSQL · SNOWFLAKE</text>
    <text x="760" y="22" fill="#00F0FF" font-size="11" font-weight="600" class="mono">OPEN SOURCE // MIT LICENSE // PYTHON 3.11+</text>
  </g>
</svg>
