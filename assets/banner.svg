<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background: Deep Void with subtle warm-indigo undertone -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050609" />
      <stop offset="45%" stop-color="#07090F" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <!-- Controlled Atmospheric Lights (Single signature cyan accent + restrained slate violet) -->
    <radialGradient id="cyanCore" cx="24%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoCore" cx="82%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#312E81" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Crosshair Grid -->
    <pattern id="precisionGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35" />
      <path d="M 24 21 L 24 27 M 21 24 L 27 24" stroke="#334155" stroke-width="0.5" stroke-opacity="0.2" />
    </pattern>

    <!-- Bento Card Surfaces (2026 High-contrast layered dark mode) -->
    <linearGradient id="bentoSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0.90" />
    </linearGradient>
    <linearGradient id="bentoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#64748B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.30" />
    </linearGradient>

    <!-- Node Gradient Fills -->
    <linearGradient id="nodeActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0C1E36" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="nodeBridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Kinetic Accent Beam for Graph Edges -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Top Horizon Micro-Bevel -->
    <linearGradient id="topBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Geist", "Inter Display", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: "Geist Mono", "JetBrains Mono", "SF Mono", "Fira Code", monospace; }
  </style>

  <!-- Deep Canvas -->
  <rect width="1280" height="640" fill="url(#bgCanvas)" />
  <rect width="1280" height="640" fill="url(#cyanCore)" />
  <rect width="1280" height="640" fill="url(#indigoCore)" />
  <rect width="1280" height="640" fill="url(#precisionGrid)" />

  <!-- Top Razor Horizon -->
  <line x1="0" y1="0" x2="1280" y2="0" stroke="url(#topBevel)" stroke-width="2" />

  <!-- ==================== LEFT COLUMN: TECHNICAL SPEC & PROPOSITION ==================== -->
  <g transform="translate(80, 0)">
    <!-- FIG 0.1 Technical Taxonomy Badge (Linear / Attio Pattern) -->
    <g transform="translate(0, 100)">
      <rect width="270" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#00F0FF" />
      <text x="26" y="18" fill="#94A3B8" font-size="11" font-weight="600" class="font-mono" letter-spacing="0.8">SPEC // SCHEMA RAG ARCHITECTURE</text>
    </g>

    <!-- Brand Identity: Kinetic Typographic Lockup -->
    <text x="0" y="200" fill="#F8FAFC" font-size="64" font-weight="800" class="font-sans" letter-spacing="-2.5">
      Schema<tspan fill="#00F0FF">Link</tspan>
    </text>

    <!-- Precision Subheading -->
    <text x="0" y="244" fill="#E2E8F0" font-size="20" font-weight="500" class="font-sans" letter-spacing="-0.3">
      High-Precision Schema Discovery &amp; Linking for Text-to-SQL
    </text>
    <text x="0" y="272" fill="#64748B" font-size="15" font-weight="400" class="font-sans">
      Retrieves minimal relational schema and resolves multi-hop join paths. Zero row vectorization.
    </text>

    <!-- Bento Spec Grid: 3 Metric & Capability Tokens -->
    <g transform="translate(0, 320)">
      <!-- Bento Token 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="74" rx="8" fill="#090D15" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="24" fill="#64748B" font-size="10" font-weight="600" class="font-mono" letter-spacing="1">INDEXATION</text>
        <text x="14" y="44" fill="#F8FAFC" font-size="15" font-weight="700" class="font-sans">Zero Row</text>
        <text x="14" y="60" fill="#00F0FF" font-size="11" font-weight="500" class="font-mono">DDL &amp; Enums only</text>
      </g>
      <!-- Bento Token 2 -->
      <g transform="translate(176, 0)">
        <rect width="160" height="74" rx="8" fill="#090D15" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="24" fill="#64748B" font-size="10" font-weight="600" class="font-mono" letter-spacing="1">TOPOLOGY</text>
        <text x="14" y="44" fill="#F8FAFC" font-size="15" font-weight="700" class="font-sans">Graph Joins</text>
        <text x="14" y="60" fill="#38BDF8" font-size="11" font-weight="500" class="font-mono">Steiner Bridge</text>
      </g>
      <!-- Bento Token 3 -->
      <g transform="translate(352, 0)">
        <rect width="160" height="74" rx="8" fill="#090D15" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="24" fill="#64748B" font-size="10" font-weight="600" class="font-mono" letter-spacing="1">EFFICIENCY</text>
        <text x="14" y="44" fill="#F8FAFC" font-size="15" font-weight="700" class="font-sans">-84% Tokens</text>
        <text x="14" y="60" fill="#10B981" font-size="11" font-weight="500" class="font-mono">&lt; 50ms latency</text>
      </g>
    </g>

    <!-- Technical System Attributes -->
    <g transform="translate(0, 442)" class="font-mono" font-size="12">
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#475569" font-weight="600">ENGINES</text>
        <text x="110" y="0" fill="#94A3B8">PostgreSQL · MySQL · SQLite · MSSQL · Snowflake</text>
      </g>
      <g transform="translate(0, 24)">
        <text x="0" y="0" fill="#475569" font-weight="600">PIPELINE</text>
        <text x="110" y="0" fill="#94A3B8">FastEmbed (ONNX) + Qdrant + NetworkX + LangGraph</text>
      </g>
      <g transform="translate(0, 48)">
        <text x="0" y="0" fill="#475569" font-weight="600">PROTOCOLS</text>
        <text x="110" y="0" fill="#94A3B8">Model Context Protocol (MCP) · LangChain · FastAPI</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: PRODUCT-AS-DEMO (INTERACTIVE GRAPH DAG) ==================== -->
  <g transform="translate(680, 80)">
    <!-- Layered Bento Console -->
    <rect width="520" height="480" rx="12" fill="url(#bentoSurface)" stroke="url(#bentoBorder)" stroke-width="1" />

    <!-- Technical Header Bar -->
    <rect width="520" height="40" rx="12" fill="#090D15" fill-opacity="0.95" />
    <path d="M 0 40 L 520 40" stroke="#1E293B" stroke-width="1" />
    
    <!-- Status Window Controls -->
    <circle cx="20" cy="20" r="4.5" fill="#EF4444" fill-opacity="0.75" />
    <circle cx="34" cy="20" r="4.5" fill="#F59E0B" fill-opacity="0.75" />
    <circle cx="48" cy="20" r="4.5" fill="#10B981" fill-opacity="0.75" />
    
    <text x="70" y="24" fill="#94A3B8" font-size="11" font-weight="500" class="font-mono">FIG 0.2 // schema_bridge_resolver.py</text>
    
    <!-- State Badge -->
    <rect x="420" y="11" width="84" height="18" rx="4" fill="#082F49" stroke="#00F0FF" stroke-width="0.75" />
    <text x="430" y="24" fill="#00F0FF" font-size="10" font-weight="700" class="font-mono">STATE: HITL</text>

    <!-- Query Prompt Box -->
    <g transform="translate(20, 56)">
      <rect width="480" height="38" rx="6" fill="#05070D" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="23" fill="#64748B" font-size="11" class="font-mono">Q: &quot;Find customers who ordered electronics in California&quot;</text>
    </g>

    <!-- ================= GRAPH NODES & EDGES ================= -->
    <!-- Edge 1: Customers -> Orders -->
    <path d="M 125 155 L 245 155" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="3 3" />
    <path d="M 245 155 L 245 220" stroke="#00F0FF" stroke-width="1.8" />
    
    <!-- Edge 2: Orders -> Order Details (Bridge Discovered) -->
    <path d="M 245 280 L 245 345" stroke="#38BDF8" stroke-width="2" />
    <rect x="220" y="300" width="50" height="16" rx="3" fill="#082F49" stroke="#38BDF8" stroke-width="0.75" />
    <text x="226" y="312" fill="#38BDF8" font-size="9" font-weight="700" class="font-mono">BRIDGE</text>

    <!-- Edge 3: Order Details -> Products -->
    <path d="M 320 375 L 380 375" stroke="#818CF8" stroke-width="1.8" />

    <!-- Node 1: Customers (Endpoint Table) -->
    <g transform="translate(20, 125)">
      <rect width="130" height="60" rx="6" fill="url(#nodeActive)" stroke="#00F0FF" stroke-width="1.2" />
      <text x="12" y="24" fill="#F8FAFC" font-size="12" font-weight="700" class="font-sans">Customers</text>
      <text x="12" y="42" fill="#00F0FF" font-size="10" class="font-mono">PK: CustomerID</text>
      <circle cx="116" cy="18" r="3" fill="#10B981" />
    </g>

    <!-- Node 2: Orders (Intermediate Bridge) -->
    <g transform="translate(180, 220)">
      <rect width="130" height="60" rx="6" fill="url(#nodeBridge)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="12" y="24" fill="#F8FAFC" font-size="12" font-weight="700" class="font-sans">Orders</text>
      <text x="12" y="42" fill="#38BDF8" font-size="10" class="font-mono">FK: CustomerID</text>
      <circle cx="116" cy="18" r="3" fill="#00F0FF" />
    </g>

    <!-- Node 3: Order Details (Resolved Bridge) -->
    <g transform="translate(180, 345)">
      <rect width="140" height="60" rx="6" fill="url(#nodeBridge)" stroke="#818CF8" stroke-width="1.2" />
      <text x="12" y="24" fill="#F8FAFC" font-size="12" font-weight="700" class="font-sans">Order Details</text>
      <text x="12" y="42" fill="#818CF8" font-size="10" class="font-mono">FK: ProductID</text>
      <circle cx="126" cy="18" r="3" fill="#818CF8" />
    </g>

    <!-- Node 4: Products (Endpoint Table) -->
    <g transform="translate(370, 345)">
      <rect width="130" height="60" rx="6" fill="url(#nodeActive)" stroke="#00F0FF" stroke-width="1.2" />
      <text x="12" y="24" fill="#F8FAFC" font-size="12" font-weight="700" class="font-sans">Products</text>
      <text x="12" y="42" fill="#00F0FF" font-size="10" class="font-mono">Category = 'Elec'</text>
      <circle cx="116" cy="18" r="3" fill="#10B981" />
    </g>

    <!-- Curated Output Telemetry Bar -->
    <g transform="translate(20, 420)">
      <rect width="480" height="42" rx="6" fill="#05070D" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="19" fill="#F8FAFC" font-size="11" font-weight="600" class="font-mono">Output: 4 Tables · 14 Columns · 3 Join Edges</text>
      <text x="14" y="33" fill="#00F0FF" font-size="10" class="font-mono">Token compaction: 320 tokens (84% reduction vs 2,150 full DDL)</text>
      <text x="420" y="25" fill="#10B981" font-size="11" font-weight="700" class="font-mono">42ms</text>
    </g>
  </g>

  <!-- Technical Spec Footer Perimeter -->
  <line x1="80" y1="586" x2="1200" y2="586" stroke="#1E293B" stroke-width="1" />
  <text x="80" y="608" fill="#475569" font-size="11" class="font-mono" letter-spacing="0.5">SCHEMALINK // AUTONOMOUS &amp; HITL SCHEMA RETRIEVAL ENGINE</text>
  <text x="1060" y="608" fill="#475569" font-size="11" class="font-mono">BUILD: RELEASE-2026.1</text>
</svg>
