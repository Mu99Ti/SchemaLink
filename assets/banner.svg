<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Mesh Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoGlow" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- UI Card Surface -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748B" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, monospace; }
  </style>

  <!-- Deep Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Ambient Glow Fields -->
  <rect width="1280" height="640" fill="url(#cyanGlow)" />
  <rect width="1280" height="640" fill="url(#indigoGlow)" />
  <rect width="1280" height="640" fill="url(#emeraldGlow)" />

  <!-- Structural Grid -->
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Top Accent Horizon Line -->
  <line x1="0" y1="0" x2="1280" y2="0" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- ==================== LEFT COLUMN: BRANDING & SPEC ==================== -->
  <g transform="translate(80, 0)">
    <!-- Status / Architecture Badge -->
    <g transform="translate(0, 110)">
      <rect width="260" height="32" rx="16" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="16" r="4" fill="#00F0FF" filter="url(#glow)" />
      <text x="30" y="21" fill="#38BDF8" font-size="12" font-weight="600" class="font-mono" letter-spacing="1">SCHEMA RAG ENGINE // 2026</text>
    </g>

    <!-- Product Title -->
    <text x="0" y="215" fill="url(#titleGrad)" font-size="64" font-weight="800" class="font-sans" letter-spacing="-2">Schema<tspan fill="url(#accentGrad)">Link</tspan></text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="260" fill="#94A3B8" font-size="20" font-weight="400" class="font-sans">
      High-Precision Schema Discovery &amp; Linking for Text-to-SQL
    </text>
    <text x="0" y="288" fill="#64748B" font-size="16" font-weight="400" class="font-sans">
      Index database metadata and relationship graphs, not millions of raw records.
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 340)">
      <!-- Pillar 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="64" rx="8" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="26" fill="#00F0FF" font-size="11" font-weight="700" class="font-mono" letter-spacing="0.5">ZERO ROW</text>
        <text x="14" y="46" fill="#F1F5F9" font-size="13" font-weight="500" class="font-sans">No Record Vectors</text>
      </g>
      <!-- Pillar 2 -->
      <g transform="translate(175, 0)">
        <rect width="160" height="64" rx="8" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="26" fill="#818CF8" font-size="11" font-weight="700" class="font-mono" letter-spacing="0.5">HYBRID RRF</text>
        <text x="14" y="46" fill="#F1F5F9" font-size="13" font-weight="500" class="font-sans">Table + Col Fusion</text>
      </g>
      <!-- Pillar 3 -->
      <g transform="translate(350, 0)">
        <rect width="160" height="64" rx="8" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="26" fill="#34D399" font-size="11" font-weight="700" class="font-mono" letter-spacing="0.5">GRAPH JOIN</text>
        <text x="14" y="46" fill="#F1F5F9" font-size="13" font-weight="500" class="font-sans">Bridge Discovery</text>
      </g>
    </g>

    <!-- Architecture Tags / Specs -->
    <g transform="translate(0, 455)" class="font-mono" font-size="12" fill="#64748B">
      <text x="0" y="0">DIALECTS</text>
      <text x="90" y="0" fill="#94A3B8">PostgreSQL · MySQL · SQLite · MSSQL · Snowflake</text>
      
      <text x="0" y="26">RUNTIME</text>
      <text x="90" y="26" fill="#94A3B8">FastEmbed (ONNX) + Qdrant + NetworkX + LangGraph</text>

      <text x="0" y="52">INTERFACES</text>
      <text x="90" y="52" fill="#94A3B8">Model Context Protocol (MCP) · LangChain · REST · SDK</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: RELATIONAL GRAPH & CONTEXT CARD ==================== -->
  <g transform="translate(680, 80)">
    <!-- Glassmorphic Container -->
    <rect width="520" height="480" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" />

    <!-- Terminal Header Bar -->
    <rect width="520" height="42" rx="16" fill="#0F172A" fill-opacity="0.9" />
    <path d="M 0 42 L 520 42" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10B981" fill-opacity="0.8" />
    <text x="80" y="26" fill="#94A3B8" font-size="12" font-weight="500" class="font-mono">schemalink // schema_resolution_graph.dag</text>
    <rect x="420" y="12" width="80" height="18" rx="4" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="0.75" />
    <text x="432" y="25" fill="#38BDF8" font-size="10" font-weight="600" class="font-mono">RESOLVED</text>

    <!-- Relational Graph Visuals (Bridge Discovery Illustration) -->
    <!-- Connection Lines / Paths -->
    <!-- Customers -> Orders -->
    <path d="M 120 125 L 260 125" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 260 125 L 260 215" stroke="#38BDF8" stroke-width="2" />
    
    <!-- Orders -> Order Items (Bridge) -->
    <path d="M 260 275 L 260 335" stroke="#818CF8" stroke-width="2" />

    <!-- Order Items -> Products -->
    <path d="M 330 365 L 400 365" stroke="#34D399" stroke-width="2" />

    <!-- Products -> Categories -->
    <path d="M 400 365 L 400 235 L 340 235" stroke="#F472B6" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Node 1: Customers -->
    <g transform="translate(30, 95)">
      <rect width="120" height="60" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" />
      <text x="12" y="24" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono">Customers</text>
      <text x="12" y="42" fill="#64748B" font-size="10" class="font-mono">PK: CustomerID</text>
    </g>

    <!-- Node 2: Orders (Intermediate Bridge) -->
    <g transform="translate(200, 215)">
      <rect width="130" height="60" rx="8" fill="#0B132B" stroke="#818CF8" stroke-width="1.5" />
      <text x="12" y="24" fill="#818CF8" font-size="11" font-weight="700" class="font-mono">Orders</text>
      <text x="12" y="42" fill="#64748B" font-size="10" class="font-mono">FK: CustomerID</text>
    </g>

    <!-- Node 3: Order Details (Bridge) -->
    <g transform="translate(195, 335)">
      <rect width="140" height="60" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
      <text x="12" y="24" fill="#34D399" font-size="11" font-weight="700" class="font-mono">Order Details</text>
      <text x="12" y="42" fill="#64748B" font-size="10" class="font-mono">FK: ProductID</text>
    </g>

    <!-- Node 4: Products -->
    <g transform="translate(370, 335)">
      <rect width="120" height="60" rx="8" fill="#0B132B" stroke="#F472B6" stroke-width="1.5" />
      <text x="12" y="24" fill="#F472B6" font-size="11" font-weight="700" class="font-mono">Products</text>
      <text x="12" y="42" fill="#64748B" font-size="10" class="font-mono">FK: CategoryID</text>
    </g>

    <!-- Mini Curated Schema Output Drawer -->
    <g transform="translate(20, 410)">
      <rect width="480" height="52" rx="8" fill="#020617" fill-opacity="0.9" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="26" r="4" fill="#10B981" />
      <text x="30" y="23" fill="#F8FAFC" font-size="11" font-weight="600" class="font-mono">Context Assembled: 4 tables · 12 columns</text>
      <text x="30" y="39" fill="#00F0FF" font-size="10" class="font-mono">Reduction: 84% tokens saved vs full DDL (320 tokens)</text>
      <text x="380" y="31" fill="#64748B" font-size="11" font-weight="500" class="font-mono">latency: 42ms</text>
    </g>
  </g>

  <!-- Bottom Accent Corner Detail -->
  <line x1="80" y1="590" x2="1200" y2="590" stroke="#334155" stroke-opacity="0.3" stroke-width="1" />
  <text x="80" y="612" fill="#475569" font-size="11" class="font-mono">SCHEMALINK ARCHITECTURE // DECOUPLED METADATA RETRIEVAL ENGINE</text>
  <text x="1050" y="612" fill="#475569" font-size="11" class="font-mono">VERSION 2.0-STABLE</text>
</svg>
